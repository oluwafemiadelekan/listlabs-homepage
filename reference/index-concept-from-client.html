<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ListLabs Homepage Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky review bar (concept switcher) above a full mock homepage. Dark hero, calm light sections, per the brand guide. */
:root{
  --primary:#8B5CF6; --primary-dark:#7C3AED; --primary-light:#A78BFA;
  --bg:#FFFFFF; --bg-alt:#F9FAFB; --surface:#FFFFFF; --fg:#111827; --fg-soft:#374151; --muted:#6B7280;
  --line:rgba(17,24,39,.09); --chip:#F5F3FF; --chip-fg:#5B21B6; --link:#7C3AED;
  --hero-bg:#111827; --hero-fg:#FFFFFF; --hero-soft:#D1D5DB; --hero-line:rgba(255,255,255,.14); --hero-panel:#1B2434;
  --bar-bg:#F3F4F6;
  --font:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:12px; --rb:10px; --maxw:1040px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131D; --bg-alt:#131A27; --surface:#171F2E; --fg:#F3F4F6; --fg-soft:#D1D5DB; --muted:#9CA3AF;
  --line:rgba(255,255,255,.1); --chip:#2A2347; --chip-fg:#DDD6FE; --link:#A78BFA;
  --hero-bg:#0A0E16; --hero-panel:#141C2B; --bar-bg:#1B2434; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131D; --bg-alt:#131A27; --surface:#171F2E; --fg:#F3F4F6; --fg-soft:#D1D5DB; --muted:#9CA3AF;
  --line:rgba(255,255,255,.1); --chip:#2A2347; --chip-fg:#DDD6FE; --link:#A78BFA;
  --hero-bg:#0A0E16; --hero-panel:#141C2B; --bar-bg:#1B2434; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;padding-inline:0}
a{color:var(--link)}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:20px}
.mark{display:block;flex:none}

/* review bar */
.review{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--bar-bg);border-bottom:1px solid var(--line);font-size:13px}
.review .wrap{display:flex;gap:12px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:10px}
.review p{margin:0;color:var(--muted);min-width:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font:600 13px var(--font);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--primary-light);outline-offset:2px}
.concept-note{background:var(--chip);color:var(--chip-fg);font-size:13px;padding:10px 0}
.concept-note p{margin:0}

/* site nav */
.nav{background:var(--hero-bg);color:var(--hero-fg);border-bottom:1px solid var(--hero-line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;letter-spacing:-.04em;color:#fff;text-decoration:none}
.brand svg{color:#fff}
.nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.nav ul a{display:block;padding:6px 10px;border-radius:7px;font-size:14px;font-weight:500;color:var(--hero-soft);text-decoration:none;transition:color .15s ease-out,background .15s ease-out}
.nav ul a:hover{color:#fff;background:rgba(255,255,255,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;font:600 15px var(--font);background:var(--primary);color:#fff;border:0;border-radius:var(--rb);padding:11px 18px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s ease-out}
.btn:hover{background:var(--primary-dark)}
.btn.sm{padding:8px 14px;font-size:14px}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-fg);padding-block:64px 72px}
.eyebrow{font:600 12px var(--font);letter-spacing:1.2px;text-transform:uppercase;color:var(--primary-dark);margin:0 0 14px}
.hero .eyebrow{color:var(--primary-light)}
.hero h1{font-size:clamp(38px,6.2vw,60px);line-height:1.02;letter-spacing:-.025em;font-weight:900;max-width:15ch}
.hero.short h1{max-width:20ch}
.hero .sub{color:var(--hero-soft);font-size:18px;line-height:1.5;max-width:46ch;margin:20px 0 0}
.claim{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;align-items:stretch}
.field{display:flex;align-items:center;gap:6px;background:var(--hero-panel);border:1px solid var(--hero-line);border-radius:var(--rb);padding:0 14px;min-width:min(100%,260px);flex:1 1 220px;max-width:340px}
.field span{color:var(--primary-light);font-weight:700}
.field input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:500 16px var(--font);padding:12px 0}
.field input::placeholder{color:#9CA3AF}
.helper{font-size:13px;color:var(--muted);margin:10px 0 0}
.hero .helper{color:var(--hero-soft)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center}
@media(max-width:820px){.hero-grid{grid-template-columns:1fr}.nav ul{display:none}}

/* clip slots (framed on dark) */
.clip{background:var(--hero-bg);border:1px solid var(--hero-line);border-radius:var(--r);padding:10px;box-shadow:0 1px 2px rgba(17,24,39,.05)}
.clip .screen{aspect-ratio:16/10;border-radius:8px;background:var(--hero-panel);border:1px dashed rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;color:var(--hero-soft);font-size:13px}
.clip .screen svg{width:30px;height:30px;stroke:var(--primary-light);fill:none;stroke-width:1.5}
.clip .tag{font:500 11px var(--mono);color:#9CA3AF}
.clip.sm .screen{aspect-ratio:16/9}

/* sections */
section.s{padding-block:72px;border-top:1px solid var(--line)}
section.alt{background:var(--bg-alt)}
section.s h2{font-size:clamp(28px,4vw,36px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.lede{color:var(--fg-soft);max-width:56ch;margin:12px 0 0}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:36px}
@media(max-width:820px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(17,24,39,.05)}
.step h3{font-size:20px;font-weight:700;letter-spacing:-.01em}
.step p{margin:0;color:var(--fg-soft)}
.n{font:600 12px var(--font);letter-spacing:1.2px;text-transform:uppercase;color:var(--primary-dark)}
.vis{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.vis li{font-size:14px;color:var(--fg-soft)}
.vis b{color:var(--chip-fg);background:var(--chip);border-radius:6px;padding:1px 7px;font-weight:600;margin-right:6px;font-size:13px}
.saved{margin-top:20px;color:var(--fg-soft);max-width:62ch}
.try{max-width:640px}
.try .box{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.try .field2{flex:1 1 260px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--rb);padding:0 14px}
.try .field2 input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:500 16px var(--font);padding:13px 0}
.try .field2 input::placeholder{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:36px}
@media(max-width:900px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(17,24,39,.05)}
.card h3{font-size:20px;font-weight:700;letter-spacing:-.01em}
.card p{margin:0;color:var(--fg-soft)}
.card .opt{font:600 12px var(--font);color:var(--chip-fg);background:var(--chip);border-radius:6px;padding:3px 8px;align-self:flex-start}
.card a{margin-top:auto;font-weight:600;text-decoration:none}
.card a:hover{text-decoration:underline}
.look{margin-top:20px;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;background:var(--surface);max-width:760px}
.look h3{font-size:20px;font-weight:700;letter-spacing:-.01em}
.look p{margin:8px 0 0;color:var(--fg-soft)}
.feats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:36px}
@media(max-width:820px){.feats{grid-template-columns:1fr}}
.feat{display:flex;flex-direction:column;gap:14px}
.feat h3{font-size:20px;font-weight:700;letter-spacing:-.01em}
.feat p{margin:6px 0 0;color:var(--fg-soft)}
.close{background:var(--hero-bg);color:var(--hero-fg);padding-block:80px;text-align:left}
.close h2{font-size:clamp(32px,5vw,48px);font-weight:900;letter-spacing:-.025em;line-height:1.05}
.close .helper{color:var(--hero-soft)}
footer{background:var(--hero-bg);color:var(--hero-soft);border-top:1px solid var(--hero-line);font-size:13px}
footer .wrap{display:flex;gap:12px 24px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding-block:20px}
footer a{color:var(--hero-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:calc(100% - 32px)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="ll" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M17 5h14"/><path d="M19.5 5v12L9.2 36.1a4.5 4.5 0 0 0 4 6.7h21.6a4.5 4.5 0 0 0 4-6.7L28.5 17V5"/><path d="M17.5 31l5 5 8.5-9"/></symbol>
</defs></svg>

<div class="review">
  <div class="wrap">
    <div class="tabs" role="tablist" aria-label="Homepage concepts">
      <button role="tab" id="t-working" data-c="working">1 Working page</button>
      <button role="tab" id="t-a" data-c="a">2 How it works first</button>
      <button role="tab" id="t-c" data-c="c">3 Uses first</button>
    </div>
    <p>Concept review. Real copy, brand styling, clip slots empty. Not the final site.</p>
  </div>
</div>
<div class="concept-note"><div class="wrap"><p id="note"></p></div></div>

<div id="site"></div>

<script>
const LOGO='<svg class="mark" width="24" height="24" aria-hidden="true"><use href="#ll"/></svg>';
const PLAY='<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="6" width="26" height="20" rx="3"/><path d="M13 12l7 4-7 4z"/></svg>';
const clip=(label,sm)=>`<div class="clip${sm?' sm':''}"><div class="screen">${PLAY}<div>${label}</div><div class="tag">product clip, to be captured</div></div></div>`;
const handleForm=(id)=>`<form class="claim" data-claim onsubmit="return false"><label class="field"><span>@</span><input id="h-${id}" placeholder="your-handle" autocomplete="off" aria-label="Your handle"></label><button class="btn" type="submit">Claim your handle</button></form><p class="helper">Free to join. First in, first found.</p>`;

const S={
header:()=>`<header class="nav"><div class="wrap"><a class="brand" href="#">${LOGO}ListLabs</a><nav aria-label="Main"><ul><li><a href="#how">How it works</a></li><li><a href="#uses">Who it's for</a></li><li><a href="#about">About</a></li><li><a href="#blog">Blog</a></li></ul></nav><button class="btn sm" data-claim-nav>Claim your handle</button></div></header>`,
heroFull:()=>`<section class="hero"><div class="wrap hero-grid"><div><p class="eyebrow">Welcome to ListLabs</p><h1>List what you have. Look for what you want.</h1><p class="sub">You get a listing, and you choose who sees it. Looking is a saved search that watches. Not a want-ad. Not one public catalog.</p>${handleForm('hero')}</div>${clip('Creating and changing a listing')}</div></section>`,
heroShort:()=>`<section class="hero short"><div class="wrap hero-grid"><div><h1>Welcome to ListLabs</h1><p class="sub">List what you have. Choose who sees it. Look for what you want with a saved search.</p></div>${clip('Creating and changing a listing')}</div></section>`,
heroC:()=>`<section class="hero"><div class="wrap hero-grid"><div><p class="eyebrow">Welcome to ListLabs</p><h1>List what you have. Look for what you want.</h1><p class="sub">A listing you control, or a saved search that watches.</p>${handleForm('hero')}</div>${clip('A listing going out to the people who can see it')}</div></section>`,
how:(full)=>`<section class="s alt" id="how"><div class="wrap"><h2>How it works</h2><div class="steps">
<div class="step"><span class="n">Step 1</span><h3>List it</h3><p>Describe what you have. Photos, docs, whatever helps. You get a listing you can change.</p>${clip('Creating and changing a listing',1)}</div>
<div class="step"><span class="n">Step 2</span><h3>Decide who sees it</h3>${full?`<ul class="vis"><li><b>Private</b>People you invite.</li><li><b>Unlisted</b>People with the link.</li><li><b>Shared</b>Members that follow you.</li><li><b>Listed</b>Members you don't know.</li><li><b>Public</b>Everyone, on every platform we integrate with.</li></ul>`:`<p>Private, unlisted, shared, listed or public. You pick, per listing.</p>`}${clip('Choosing a visibility level',1)}</div>
<div class="step"><span class="n">Step 3</span><h3>Promote it</h3><p>Drop the link on social, in email, at a meetup, anywhere you already talk. Or let someone you trust share it with their people.</p>${clip('A link going out, then a cross-promotion',1)}</div>
</div><p class="saved">Looking is not a fourth step here. Set a saved search. It watches. You hear about it when it shows up in your world.</p></div></section>`,
tryit:()=>`<section class="s" id="try"><div class="wrap try"><h2>Get started right now</h2><p class="lede">Describe something you are listing.</p><form class="box" data-try onsubmit="return false"><label class="field2"><input id="try-in" placeholder="I'm listing…" autocomplete="off" aria-label="Describe something you are listing"></label><button class="btn" type="submit">Start listing</button></form><p class="helper">No handle yet. Claim one when you want to keep it. Looking instead? Set a saved search after you start.</p></div></section>`,
uses:()=>`<section class="s alt" id="uses"><div class="wrap"><h2>Same tool. Different jobs.</h2>
<div class="cards">
<article class="card"><h3>Instead of fifty DMs</h3><p>New stock used to mean the same text, sent again and again. One listing. Shared. The people who follow you see it. You stop repeating yourself.</p><span class="opt">Shared</span><a href="#uses">Collectibles</a></article>
<article class="card"><h3>Instead of a public auction</h3><p>Going public puts the car in a pile with everyone else's price. Unlisted. Send the link to the people who can know. Widen it later if you want.</p><span class="opt">Unlisted</span><a href="#uses">Classic cars</a></article>
<article class="card"><h3>Instead of a teaser you can't take back</h3><p>Once a one-pager is forwarded, you don't control who has it. Unlisted. Send the link to the buyers who can know.</p><span class="opt">Unlisted</span><a href="#uses">Business brokers</a></article>
</div>
<div class="look"><h3>Instead of asking around</h3><p>You don't list what you want. You set a saved search. It watches. You hear about it when it shows up in your world. That is the look side. Same product.</p></div></div></section>`,
features:()=>`<section class="s" id="features"><div class="wrap"><h2>What you get</h2><div class="feats">
<div class="feat">${clip('Public profile',1)}<div><h3>Public profiles</h3><p>Your handle is how people find you. Your profile holds the listings, the history, and the work.</p></div></div>
<div class="feat">${clip('The feed',1)}<div><h3>A feed uniquely your own</h3><p>No one sees everything on ListLabs. You see what you've earned access to.</p></div></div>
<div class="feat">${clip('A listings widget on an outside site',1)}<div><h3>Widgets and sites</h3><p>Drop your listings on a site you already run. They update when you change them.</p></div></div>
<div class="feat">${clip('Sharing someone else\'s listing',1)}<div><h3>Cross-promotion</h3><p>Share someone else's listing with your people. They opt in. You both get the introduction.</p></div></div>
</div></div></section>`,
close:()=>`<section class="close" id="join"><div class="wrap"><h2>You're either first, or last.</h2>${handleForm('close')}</div></section>`,
footer:()=>`<footer><div class="wrap"><span>Privacy policy &nbsp;·&nbsp; Terms &amp; conditions</span><span>Social icons here</span></div></footer>`
};

const CONCEPTS={
working:{note:'Spine from the copy draft. Handle form in the hero, how it works next, visibility written out in step 2. Handle also in the nav and the close.',
  order:['header','heroFull',['how',1],'tryit','uses','features','close','footer']},
a:{note:'Short welcome, no handle form in the hero. The three steps do the teaching and step 2 spells out the five visibility levels. Handle lives in the nav and the close only.',
  order:['header','heroShort',['how',1],'tryit','uses','features','close','footer']},
c:{note:'Proof first. The status-quo cards come right after the hero, then how it works names what you just saw. Visibility is short in step 2 because the cards already named the options.',
  order:['header','heroC','uses',['how',0],'tryit','features','close','footer']}
};

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;e.setAttribute('role','status');document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
function render(k){
  const c=CONCEPTS[k]||CONCEPTS.working;
  document.getElementById('site').innerHTML=c.order.map(x=>Array.isArray(x)?S[x[0]](x[1]):S[x]()).join('');
  document.getElementById('note').textContent=c.note;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.c===k));
}
function go(k){if(!CONCEPTS[k])k='working';render(k);try{history.replaceState(null,'','#'+k)}catch(e){}}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){go(b.dataset.c);window.scrollTo(0,0)}});
document.addEventListener('submit',e=>{
  if(e.target.matches('[data-claim]'))toast('Concept only. In the build this goes to the real product signup.');
  if(e.target.matches('[data-try]'))toast('Concept only. In the build this starts a listing.');
});
document.addEventListener('click',e=>{if(e.target.closest('[data-claim-nav]'))toast('Concept only. In the build this goes to the real product signup.')});
go(location.hash.slice(1)||'working');
</script>

</body></html>
